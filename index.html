<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI工具集</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@1.7.0"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== 设计 Token：Dark 模式（默认） ===== */
    :root,
    .dark {
      --color-brand-300: #8a5740;
      --color-brand-400: #b0683f;
      --color-brand-500: #d97757;
      --color-brand-600: #e08d6f;
      --color-brand-700: #e8a98f;

      --color-bg-50: #1b1b19;
      --color-bg-100: #262624;
      --color-bg-200: #2c2c2b;
      --color-bg-300: #30302e;
      --color-bg-400: #3e3e38;
      --color-bg-500: #4a4a43;
      --color-bg-700: #6e6d68;
      --color-bg-800: #908e84;

      --color-text-900: #faf9f5;
      --color-text-800: #f1f1ef;
      --color-text-700: #d8d6cd;
      --color-text-600: #c3c0b6;
      --color-text-500: #b7b5a9;
      --color-text-400: #908e84;
      --color-text-300: #6e6d68;
      --color-text-200: #46443b;
      --color-text-100: #2c2c2b;
      --color-text-50: #1b1b19;

      --color-border-200: #343430;
      --color-border-300: #3e3e38;
      --color-border-400: #4a4a43;
      --color-border-500: #52514a;
      --color-border-600: #6e6d68;
      --color-border-700: #908e84;

      --color-success-500: #8ca06f;
      --color-success-700: #bccaa8;
      --color-error-500: #ef4444;

      --color-dark-primary: #d97757;
      --color-dark-card: #2c2c2b;
      --color-dark-card-foreground: #faf9f5;
      --color-dark-muted-foreground: #b7b5a9;
      --color-dark-secondary: #e9e6dc;
      --color-dark-secondary-foreground: #2c2c2b;
      --color-dark-accent: #3e3e38;
      --color-dark-primary-foreground: #141413;
      --color-dark-destructive: #ef4444;

      --shadow-sm: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1);
      --shadow-md: 0 1px 3px 0 rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 1px 3px 0 rgba(0,0,0,0.1), 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-xl: 0 1px 3px 0 rgba(0,0,0,0.1), 0 8px 10px -1px rgba(0,0,0,0.1);
      --shadow-2xl: 0 1px 3px 0 rgba(0,0,0,0.25);
    }

    /* ===== Light 模式 ===== */
    .light {
      --color-bg-50: #faf9f5;
      --color-bg-100: #f1f1ef;
      --color-bg-200: #e9e6dc;
      --color-bg-300: #e0ddd3;
      --color-bg-400: #d0cdc3;
      --color-bg-500: #b7b5a9;
      --color-bg-700: #908e84;
      --color-bg-800: #6e6d68;

      --color-text-900: #1b1b19;
      --color-text-800: #2c2c2b;
      --color-text-700: #46443b;
      --color-text-600: #6e6d68;
      --color-text-500: #908e84;
      --color-text-400: #b7b5a9;
      --color-text-300: #d0cdc3;
      --color-text-200: #e0ddd3;
      --color-text-100: #f1f1ef;
      --color-text-50: #faf9f5;

      --color-border-200: #e0ddd3;
      --color-border-300: #d0cdc3;
      --color-border-400: #3e3e38;
      --color-border-500: #4a4a43;
      --color-border-600: #52514a;
      --color-border-700: #6e6d68;

      --color-dark-card: #ffffff;
      --color-dark-secondary: #46443b;
      --color-dark-secondary-foreground: #faf9f5;
      --color-dark-primary-foreground: #faf9f5;
      --color-dark-destructive: #dc2626;

      --shadow-sm: 0 1px 3px 0 rgba(0,0,0,0.06), 0 1px 2px -1px rgba(0,0,0,0.06);
      --shadow-md: 0 1px 3px 0 rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 1px 3px 0 rgba(0,0,0,0.06), 0 4px 6px -1px rgba(0,0,0,0.06);
      --shadow-xl: 0 1px 3px 0 rgba(0,0,0,0.06), 0 8px 10px -1px rgba(0,0,0,0.06);
      --shadow-2xl: 0 1px 3px 0 rgba(0,0,0,0.12);
    }

    /* ===== 字体 / 圆角 Token ===== */
    :root {
      --font-display: 'Newsreader', Georgia, ui-serif, serif;
      --font-sans: 'Poppins', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-2xl: 24px;
      --radius-full: 9999px;
    }

    /* ===== 全局样式 ===== */
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background-color: var(--color-bg-50);
      color: var(--color-text-900);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* ===== 导航栏 ===== */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--color-bg-50);
      border-bottom: 1px solid var(--color-border-200);
    }
    .nav-inner {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 16px;
      max-width: 1280px;
      margin: 0 auto;
    }
    @media (min-width: 640px) { .nav-inner { height: 64px; padding: 0 24px; } }
    @media (min-width: 1024px) { .nav-inner { padding: 0 32px; } }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      color: var(--color-brand-500);
    }
    .nav-logo svg { width: 24px; height: 24px; }
    .nav-logo-text {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-900);
    }
    @media (min-width: 640px) { .nav-logo-text { font-size: 18px; } }

    /* ===== 分类标签 ===== */
    .category-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 14px;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background-color: transparent;
      color: var(--color-text-500);
      font-size: 13px;
      font-family: var(--font-sans);
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .category-pill:hover {
      background-color: var(--color-bg-200);
      color: var(--color-text-700);
    }
    .category-pill.active {
      background-color: var(--color-brand-500);
      color: var(--color-dark-primary-foreground);
      border-color: var(--color-brand-500);
    }

    .category-list {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-list::-webkit-scrollbar { display: none; }

    /* ===== 搜索输入框 ===== */
    .search-input {
      width: 200px;
      height: 36px;
      padding: 0 12px 0 36px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border-300);
      background-color: var(--color-bg-100);
      color: var(--color-text-900);
      font-size: 14px;
      font-family: var(--font-sans);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-input::placeholder { color: var(--color-text-400); }
    .search-input:focus {
      border-color: var(--color-brand-500);
      box-shadow: 0 0 0 2px rgba(217,119,87,0.15);
    }
    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-wrap .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: var(--color-text-400);
      pointer-events: none;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-400);
      cursor: pointer;
      border-radius: var(--radius-full);
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .icon-btn:hover { color: var(--color-text-700); background-color: var(--color-bg-200); }
    .icon-btn svg { width: 20px; height: 20px; }

    .mobile-dropdown {
      background-color: var(--color-bg-50);
      border-bottom: 1px solid var(--color-border-200);
      padding: 12px 16px;
    }

    /* ===== Hero 区域 ===== */
    .hero-section {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--color-bg-50) 0%, var(--color-bg-100) 100%);
    }
    .hero-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 350px;
      background: var(--color-brand-500);
      opacity: 0.05;
      filter: blur(100px);
      pointer-events: none;
      border-radius: 50%;
    }
    .hero-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 768px;
      margin: 0 auto;
      padding: 64px 16px;
    }
    @media (min-width: 640px) { .hero-content { padding: 80px 24px; } }
    @media (min-width: 1024px) { .hero-content { padding: 112px 32px; } }
    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(36px, 5vw, 64px);
      font-weight: 500;
      line-height: 1.2;
      color: var(--color-text-900);
      text-wrap: balance;
      word-break: keep-all;
      overflow-wrap: break-word;
      margin: 0;
    }
    .hero-subtitle {
      font-family: var(--font-sans);
      font-size: 16px;
      color: var(--color-text-500);
      margin-top: 16px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }
    @media (min-width: 640px) { .hero-subtitle { font-size: 18px; } }

    /* ===== 卡片网格 ===== */
    .grid-section {
      background-color: var(--color-bg-50);
      padding: 48px 16px;
    }
    @media (min-width: 640px) { .grid-section { padding: 64px 24px; } }
    @media (min-width: 1024px) { .grid-section { padding: 80px 32px; } }
    .grid-container { max-width: 1280px; margin: 0 auto; }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    @media (max-width: 767px) {
      .tool-grid { grid-template-columns: 1fr; }
    }

    /* ===== 工具卡片 ===== */
    .tool-card {
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border-300);
      background: var(--color-dark-card);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }
    .tool-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .tool-card.card-hidden { display: none; }

    .card-image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background-color: var(--color-bg-200);
    }
    .card-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .tool-card:hover .card-preview-img { transform: scale(1.03); }

    .card-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tool-card:hover .card-overlay { opacity: 1; }

    .overlay-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      border: none;
      background-color: var(--color-brand-500);
      color: var(--color-dark-primary-foreground);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-sans);
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .overlay-btn:hover { background-color: var(--color-brand-600); }
    .overlay-btn-secondary {
      background-color: rgba(255, 255, 255, 0.15);
      color: var(--color-text-900);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .overlay-btn-secondary:hover { background-color: rgba(255, 255, 255, 0.25); }

    .card-body { padding: 16px 18px 18px; }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-900);
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-desc {
      font-size: 13px;
      color: var(--color-text-500);
      line-height: 1.6;
      margin: 6px 0 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .tech-tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      background-color: var(--color-bg-400);
      color: var(--color-text-600);
      font-size: 12px;
      font-family: var(--font-sans);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-sans);
      white-space: nowrap;
    }
    .status-live { background-color: var(--color-success-500); color: var(--color-dark-primary-foreground); }
    .status-dev  { background-color: var(--color-brand-500); color: var(--color-dark-primary-foreground); }
    .status-exp  { background-color: var(--color-brand-400); color: var(--color-text-900); }
    .status-arch { background-color: var(--color-bg-500); color: var(--color-text-400); }

    /* ===== 空状态 ===== */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 16px;
      color: var(--color-text-400);
    }
    .empty-state-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--color-text-600);
      margin: 0 0 8px;
    }
    .empty-state-desc {
      font-size: 14px;
      color: var(--color-text-400);
      margin: 0;
      line-height: 1.6;
    }

    /* ===== 详情模态 ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      overflow-y: auto;
    }
    .modal-overlay.hidden { display: none; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .modal-panel {
      position: relative;
      width: 100%;
      max-width: 800px;
      border-radius: var(--radius-xl);
      background-color: var(--color-bg-100);
      box-shadow: var(--shadow-2xl);
      overflow: hidden;
      z-index: 1;
    }
    .modal-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: var(--radius-full);
      background-color: var(--color-bg-400);
      color: var(--color-text-700);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .modal-close-btn:hover { background-color: var(--color-bg-500); }
    .modal-close-btn svg { width: 20px; height: 20px; }

    .modal-image-section {
      width: 100%;
      aspect-ratio: 16 / 7;
      overflow: hidden;
      background-color: var(--color-bg-200);
    }
    .modal-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .modal-content-body { padding: 24px 28px 32px; }

    .modal-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text-900);
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
    }
    @media (min-width: 640px) { .modal-title { font-size: 24px; } }

    .modal-desc {
      font-size: 14px;
      color: var(--color-text-500);
      line-height: 1.6;
      margin: 12px 0 8px;
    }
    .modal-time {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--color-text-300);
      margin-bottom: 16px;
    }
    .modal-tech-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 24px;
    }

    .modal-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--color-border-200);
    }
    .modal-section-heading {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-900);
      margin: 0 0 10px;
    }

    .prompt-block {
      padding: 14px 18px;
      border-radius: var(--radius-md);
      background-color: var(--color-bg-50);
      border: 1px solid var(--color-border-300);
    }
    .prompt-label {
      display: block;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--color-text-400);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .prompt-code {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--color-text-700);
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
      margin: 0;
    }

    .feature-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .feature-list li {
      font-size: 14px;
      color: var(--color-text-600);
      line-height: 1.6;
      padding-left: 18px;
      position: relative;
    }
    .feature-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 9px;
      width: 6px;
      height: 6px;
      border-radius: var(--radius-full);
      background-color: var(--color-brand-500);
    }

    .modal-meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }
    .modal-meta-label {
      font-size: 12px;
      color: var(--color-text-400);
    }

    .story-paragraph {
      color: var(--color-text-600);
      line-height: 1.8;
      font-size: 14px;
      margin: 16px 0 0;
    }

    .modal-cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 24px;
      margin-top: 24px;
      border-radius: var(--radius-sm);
      background-color: var(--color-brand-500);
      color: var(--color-dark-primary-foreground);
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-sans);
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.15s ease;
    }
    .modal-cta-btn:hover { background-color: var(--color-brand-600); }

    @media (max-width: 639px) {
      .modal-overlay { padding: 16px 0; align-items: flex-end; }
      .modal-panel {
        max-width: 100%;
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-content-body { padding: 20px 18px 28px; }
      .modal-image-section { aspect-ratio: 16 / 9; }
    }

    /* ===== 页脚 ===== */
    .site-footer {
      background-color: var(--color-bg-50);
      border-top: 1px solid var(--color-border-200);
      padding: 24px 16px;
      text-align: center;
    }
    .footer-link {
      font-size: 12px;
      color: var(--color-text-400);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .footer-link:hover { color: var(--color-text-600); }

    /* ===== 减弱动效 ===== */
    @media (prefers-reduced-motion: reduce) {
      .hero-canvas { display: none; }
      * { transition-duration: 0.01ms !important; }
    }
  </style>
</head>

  <!-- ===== 页脚 ===== -->

  </footer>

  <script>
  (function () {
    'use strict';

    /* =========================================================
     * 工具数据（初始为空，工具上架时由构建脚本追加对象）
     * 字段说明见 spec.md 第 11 节
     * 新增工具时请按以下结构追加：
     * {
     *   name, desc, category, status, image, toolUrl,
     *   tech[], prompt, aiTool, iterations, createdAt,
     *   problem, features[], story
     * }
     * ======================================================= */
    var toolData = [];

    /* 状态文字 → CSS 类映射 */
    var STATUS_CLASS_MAP = {
      '已上线': 'status-live',
      '开发中': 'status-dev',
      '实验性': 'status-exp',
      'Archive': 'status-arch'
    };
    function statusClassFor(status) {
      return STATUS_CLASS_MAP[status] || 'status-arch';
    }

    /* =========================================================
     * 渲染：分类标签（根据已有工具动态增减）
     * ======================================================= */
    function getCategories() {
      var seen = {};
      var list = [];
      for (var i = 0; i < toolData.length; i++) {
        var c = toolData[i].category;
        if (c && !seen[c]) { seen[c] = true; list.push(c); }
      }
      // “全部” 始终位于首位，无工具时也仅显示这一项
      return ['全部'].concat(list);
    }

    function renderCategories(activeCategory) {
      var cats = getCategories();
      var active = activeCategory || '全部';
      var desktopBox = document.getElementById('desktop-categories');
      var mobileBox = document.getElementById('mobile-categories');
      var html = '';
      for (var i = 0; i < cats.length; i++) {
        var c = cats[i];
        var isActive = c === active ? ' active' : '';
        html += '<button type="button" class="category-pill' + isActive + '" data-category="' + c + '">' + c + '</button>';
      }
      desktopBox.innerHTML = html;
      mobileBox.innerHTML = html;
      bindCategoryEvents();
    }

    function bindCategoryEvents() {
      var pills = document.querySelectorAll('.category-pill');
      for (var i = 0; i < pills.length; i++) {
        (function (pill) {
          pill.addEventListener('click', function () {
            var cat = pill.getAttribute('data-category');
            // 同步所有标签的激活态
            var all = document.querySelectorAll('.category-pill');
            for (var j = 0; j < all.length; j++) {
              if (all[j].getAttribute('data-category') === cat) all[j].classList.add('active');
              else all[j].classList.remove('active');
            }
            currentCategory = cat;
            applyFilters();
            // 移动端选择后收起菜单
            if (window.innerWidth < 768) {
              document.getElementById('mobile-menu').classList.add('hidden');
            }
          });
        })(pills[i]);
      }
    }

    /* =========================================================
     * 渲染：工具卡片
     * ======================================================= */
    function renderCards() {
      var grid = document.getElementById('tool-grid');
      if (!toolData.length) {
        grid.innerHTML =
          '<div class="empty-state">' +
            '<p class="empty-state-title">暂无工具上架</p>' +
            '<p class="empty-state-desc">工具将通过 VibeCoding 方式陆续上架，敬请期待。</p>' +
          '</div>';
        return;
      }
      var html = '';
      for (var i = 0; i < toolData.length; i++) {
        var t = toolData[i];
        var techHtml = '';
        for (var k = 0; k < t.tech.length && k < 3; k++) {
          techHtml += '<span class="tech-tag">' + escapeHtml(t.tech[k]) + '</span>';
        }
        var eager = i === 0 ? 'eager' : 'lazy';
        html +=
          '<article class="tool-card" data-category="' + escapeHtml(t.category) + '" ' +
            'data-name="' + escapeHtml(t.name.toLowerCase()) + '" ' +
            'data-desc="' + escapeHtml(t.desc.toLowerCase()) + '" data-index="' + i + '">' +
            '<div class="card-image-wrapper">' +
              '<img class="card-preview-img" src="' + escapeAttr(t.image) + '" ' +
                'alt="' + escapeAttr(t.name) + ' 界面截图" loading="' + eager + '">' +
              '<div class="card-overlay">' +
                '<button type="button" class="overlay-btn" data-dom-id="detail-' + i + '">查看详情</button>' +
                '<a href="' + escapeAttr(t.toolUrl) + '" target="_blank" rel="noopener noreferrer" ' +
                  'class="overlay-btn overlay-btn-secondary">在线体验</a>' +
              '</div>' +
            '</div>' +
            '<div class="card-body">' +
              '<div class="flex items-center justify-between gap-2">' +
                '<h3 class="card-title">' + escapeHtml(t.name) + '</h3>' +
                '<span class="status-badge ' + statusClassFor(t.status) + ' shrink-0">' + escapeHtml(t.status) + '</span>' +
              '</div>' +
              '<p class="card-desc">' + escapeHtml(t.desc) + '</p>' +
              '<div class="flex flex-wrap gap-1.5 mt-3">' + techHtml + '</div>' +
            '</div>' +
          '</article>';
      }
      grid.innerHTML = html;
      bindCardEvents();
    }

    function bindCardEvents() {
      var btns = document.querySelectorAll('[data-dom-id^="detail-"]');
      for (var i = 0; i < btns.length; i++) {
        (function (btn) {
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            var id = btn.getAttribute('data-dom-id');
            var idx = parseInt(id.replace('detail-', ''), 10);
            openModal(idx);
          });
        })(btns[i]);
      }
    }

    /* =========================================================
     * 筛选 + 搜索（取交集）
     * ======================================================= */
    var currentCategory = '全部';
    var currentQuery = '';

    function applyFilters() {
      var cards = document.querySelectorAll('.tool-card');
      var q = currentQuery.trim().toLowerCase();
      for (var i = 0; i < cards.length; i++) {
        var cat = cards[i].getAttribute('data-category');
        var name = cards[i].getAttribute('data-name') || '';
        var desc = cards[i].getAttribute('data-desc') || '';
        var catOk = currentCategory === '全部' || cat === currentCategory;
        var qOk = !q || name.indexOf(q) > -1 || desc.indexOf(q) > -1;
        if (catOk && qOk) cards[i].classList.remove('card-hidden');
        else cards[i].classList.add('card-hidden');
      }
    }

    function bindSearch() {
      var d = document.getElementById('desktop-search');
      var m = document.getElementById('mobile-search');
      d.addEventListener('input', function () {
        currentQuery = d.value;
        m.value = d.value;
        applyFilters();
      });
      m.addEventListener('input', function () {
        currentQuery = m.value;
        d.value = m.value;
        applyFilters();
      });
    }

    /* =========================================================
     * 详情模态
     * ======================================================= */
    function openModal(idx) {
      var t = toolData[idx];
      if (!t) return;
      document.getElementById('modal-image').src = t.image;
      document.getElementById('modal-image').alt = t.name + ' 界面截图';
      document.getElementById('modal-title').textContent = t.name;
      var statusEl = document.getElementById('modal-status');
      statusEl.className = 'status-badge shrink-0 ' + statusClassFor(t.status);
      statusEl.textContent = t.status;
      document.getElementById('modal-desc').textContent = t.desc;
      document.getElementById('modal-time').textContent = t.createdAt || '';

      // 技术标签
      var techRow = document.getElementById('modal-tech-row');
      var techHtml = '';
      for (var i = 0; i < t.tech.length && i < 3; i++) {
        techHtml += '<span class="tech-tag">' + escapeHtml(t.tech[i]) + '</span>';
      }
      techRow.innerHTML = techHtml;

      // 问题
      document.getElementById('modal-problem').textContent = t.problem;

      // 功能列表
      var featBox = document.getElementById('modal-features');
      var featHtml = '';
      for (var j = 0; j < t.features.length && j < 4; j++) {
        featHtml += '<li>' + escapeHtml(t.features[j]) + '</li>';
      }
      featBox.innerHTML = featHtml;

      // Prompt
      document.getElementById('modal-prompt').textContent = t.prompt;

      // AI 工具 + 迭代
      var metaRow = document.getElementById('modal-meta-row');
      metaRow.innerHTML =
        '<span class="modal-meta-label">AI 工具</span>' +
        '<span class="tech-tag">' + escapeHtml(t.aiTool) + '</span>' +
        '<span class="modal-meta-label">迭代</span>' +
        '<span class="tech-tag">' + escapeHtml(t.iterations) + '</span>';

      // 故事
      document.getElementById('modal-story').textContent = t.story;

      // CTA
      var cta = document.getElementById('modal-cta');
      cta.href = t.toolUrl;

      document.getElementById('detail-modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    function bindModalEvents() {
      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('modal-backdrop').addEventListener('click', closeModal);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && !document.getElementById('detail-modal').classList.contains('hidden')) {
          closeModal();
        }
      });
    }

    /* =========================================================
     * 主题切换
     * ======================================================= */
    function applyTheme(theme) {
      var html = document.documentElement;
      var sun = document.getElementById('theme-icon-sun');
      var moon = document.getElementById('theme-icon-moon');
      if (theme === 'light') {
        html.classList.remove('dark');
        html.classList.add('light');
        sun.style.display = 'none';
        moon.style.display = '';
      } else {
        html.classList.remove('light');
        html.classList.add('dark');
        sun.style.display = '';
        moon.style.display = 'none';
      }
    }

    function initTheme() {
      var saved = null;
      try { saved = localStorage.getItem('toolbox-theme'); } catch (e) {}
      applyTheme(saved === 'light' ? 'light' : 'dark');
      document.getElementById('theme-toggle').addEventListener('click', function () {
        var isLight = document.documentElement.classList.contains('light');
        var next = isLight ? 'dark' : 'light';
        applyTheme(next);
        try { localStorage.setItem('toolbox-theme', next); } catch (e) {}
      });
    }

    /* =========================================================
     * 移动端菜单 / 搜索切换
     * ======================================================= */
    function initMobileToggles() {
      document.getElementById('hamburger-btn').addEventListener('click', function () {
        document.getElementById('mobile-menu').classList.toggle('hidden');
      });
      document.getElementById('mobile-search-btn').addEventListener('click', function () {
        document.getElementById('mobile-search-bar').classList.toggle('hidden');
      });
    }

    /* =========================================================
     * HTML 转义
     * ======================================================= */
    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    function escapeAttr(s) { return escapeHtml(s); }

    /* =========================================================
     * 水墨涟漪 Canvas 动效（spec 第 6.6 节）
     * ======================================================= */
    function initInkCanvas() {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      var canvas = document.getElementById('ink-canvas');
      if (!canvas) return;
      var hero = document.getElementById('hero-section');
      if (!hero) return;
      var ctx = canvas.getContext('2d');
      if (!ctx) return;

      var INK_PRIMARY = [217, 119, 87];   // brand-500
      var INK_SECONDARY = [176, 104, 63]; // brand-400
      var INK_MIST = [142, 87, 64];       // brand-300
      var MAX_PARTICLES = 300;

      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var particles = [];
      var animId = null;
      var lastTime = null;
      var lastX = null, lastY = null;
      var pathAccum = 0;

      function resize() {
        var w = hero.clientWidth;
        var h = hero.clientHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      function rand(a, b) { return a + Math.random() * (b - a); }

      function pickInkColor() {
        var r = Math.random();
        if (r < 0.6) return INK_PRIMARY;
        if (r < 0.85) return INK_SECONDARY;
        return INK_MIST;
      }

      function createTrailParticle(x, y, speed) {
        var angle = Math.random() * Math.PI * 2;
        var dist = Math.random() * Math.min(speed * 0.4, 30);
        var baseR = rand(2, 5);
        return {
          type: 'trail',
          x: x + Math.cos(angle) * dist,
          y: y + Math.sin(angle) * dist,
          baseR: baseR,
          maxR: baseR + rand(8, 18),
          color: pickInkColor(),
          opacity: rand(0.3, 0.7),
          life: 0,
          maxLife: rand(2000, 4000),
          sides: 8,
          jitter: []
        };
      }

      function createRipple(x, y, opts) {
        opts = opts || {};
        return {
          type: 'ripple',
          x: x, y: y,
          r: 2,
          maxR: opts.maxR != null ? opts.maxR : rand(80, 150),
          opacity: opts.opacity != null ? opts.opacity : 0.5,
          speed: rand(60, 120),
          life: 0,
          maxLife: rand(1500, 2500)
        };
      }

      function createMist(x, y) {
        return {
          type: 'mist',
          x: x + rand(-60, 60),
          y: y + rand(-60, 60),
          r: rand(200, 400),
          opacity: rand(0.03, 0.08),
          color: INK_MIST,
          life: 0,
          maxLife: rand(3000, 5000)
        };
      }

      function pushParticle(p) {
        particles.push(p);
        while (particles.length > MAX_PARTICLES) particles.shift();
      }

      function animate(ts) {
        if (lastTime == null) lastTime = ts;
        var dt = Math.min(ts - lastTime, 50);
        lastTime = ts;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.life += dt;
          var progress = p.life / p.maxLife;
          if (progress >= 1) { particles.splice(i, 1); continue; }

          if (p.type === 'trail') {
            var eased = 1 - Math.pow(1 - progress, 3);
            var r = p.baseR + (p.maxR - p.baseR) * eased;
            var alpha = p.opacity * (1 - progress);
            drawTrail(p, r, alpha);
          } else if (p.type === 'ripple') {
            p.r += (p.speed * dt) / 1000;
            var lineWidth = Math.max(0.5, 2 - 1.5 * progress);
            var rAlpha = p.opacity * (1 - progress);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(' + INK_PRIMARY.join(',') + ',' + rAlpha + ')';
            ctx.lineWidth = lineWidth;
            ctx.stroke();
          } else if (p.type === 'mist') {
            var fadeIn = progress / 0.2;
            var fadeOut = 1 - (progress - 0.2) / 0.8;
            var mAlpha = p.opacity * Math.min(1, fadeIn) * Math.max(0, fadeOut);
            var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
            grad.addColorStop(0, 'rgba(' + p.color.join(',') + ',' + (0.6 * mAlpha) + ')');
            grad.addColorStop(1, 'rgba(' + p.color.join(',') + ',0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }

          if (p.type === 'trail' && p.opacity * (1 - progress) < 0.005) {
            particles.splice(i, 1);
          }
        }

        if (particles.length > 0) {
          animId = requestAnimationFrame(animate);
        } else {
          animId = null;
          lastTime = null;
        }
      }

      function drawTrail(p, r, alpha) {
        ctx.beginPath();
        for (var i = 0; i < p.sides; i++) {
          var a = (i / p.sides) * Math.PI * 2;
          var jitter = (i % 2 === 0) ? rand(0.7, 1.3) : 1;
          var rr = r * jitter;
          var px = p.x + Math.cos(a) * rr;
          var py = p.y + Math.sin(a) * rr;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(' + p.color.join(',') + ',' + alpha + ')';
        ctx.fill();
      }

      function startLoop() {
        if (animId == null) {
          lastTime = null;
          animId = requestAnimationFrame(animate);
        }
      }

      function heroPoint(e) {
        var rect = hero.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      }

      hero.addEventListener('mousemove', function (e) {
        var pt = heroPoint(e);
        if (lastX == null) { lastX = pt.x; lastY = pt.y; return; }
        var dx = pt.x - lastX, dy = pt.y - lastY;
        var speed = Math.sqrt(dx * dx + dy * dy);
        if (speed > 1) {
          var n = Math.floor(Math.max(1, speed * 0.15));
          if (n > 6) n = 6;
          for (var i = 0; i < n; i++) pushParticle(createTrailParticle(pt.x, pt.y, speed));
          pathAccum += speed;
          if (pathAccum > rand(80, 120)) {
            pushParticle(createRipple(pt.x, pt.y));
            pathAccum = 0;
          }
          if (Math.random() < 0.03) pushParticle(createMist(pt.x, pt.y));
        }
        lastX = pt.x; lastY = pt.y;
        startLoop();
      });

      hero.addEventListener('mouseenter', function (e) {
        var pt = heroPoint(e);
        for (var i = 0; i < 4; i++) {
          (function (i) {
            setTimeout(function () {
              pushParticle(createRipple(
                pt.x + rand(-40, 40),
                pt.y + rand(-30, 30),
                { opacity: 0.35, maxR: rand(60, 120) }
              ));
              startLoop();
            }, i * 120);
          })(i);
        }
      });

      hero.addEventListener('mouseleave', function () {
        lastX = null; lastY = null;
      });
    }

    /* =========================================================
     * 初始化
     * ======================================================= */
    function init() {
      lucide.createIcons();
      initTheme();
      initMobileToggles();
      renderCategories('全部');
      renderCards();
      bindSearch();
      bindModalEvents();
      initInkCanvas();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
