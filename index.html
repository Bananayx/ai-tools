<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI工具集</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,200..800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============ Design Tokens ============ */
    :root, .dark {
      --color-brand-300: #8a5740;
      --color-brand-400: #b0683f;
      --color-brand-500: #d97757;
      --color-brand-600: #e08d6f;
      --color-brand-700: #e8a98f;

      --color-bg-50: #1b1b19;
      --color-bg-100: #262624;
      --color-bg-200: #2c2c2b;
      --color-bg-300: #30302e;
      --color-bg-400: #3e3e38;
      --color-bg-500: #4a4a43;
      --color-bg-700: #6e6d68;
      --color-bg-800: #908e84;

      --color-text-900: #faf9f5;
      --color-text-800: #f1f1ef;
      --color-text-700: #d8d6cd;
      --color-text-600: #c3c0b6;
      --color-text-500: #b7b5a9;
      --color-text-400: #908e84;
      --color-text-300: #6e6d68;
      --color-text-200: #46443b;
      --color-text-100: #2c2c2b;
      --color-text-50: #1b1b19;

      --color-border-200: #343430;
      --color-border-300: #3e3e38;
      --color-border-400: #4a4a43;
      --color-border-500: #52514a;
      --color-border-600: #6e6d68;
      --color-border-700: #908e84;

      --color-success-500: #8ca06f;
      --color-success-700: #bccaa8;
      --color-error-500: #ef4444;

      --color-dark-primary: #d97757;
      --color-dark-card: #2c2c2b;
      --color-dark-card-foreground: #faf9f5;
      --color-dark-muted-foreground: #b7b5a9;
      --color-dark-secondary: #e9e6dc;
      --color-dark-secondary-foreground: #2c2c2b;
      --color-dark-accent: #30302e;
      --color-dark-primary-foreground: #141413;
      --color-dark-destructive: #ef4444;

      --shadow-sm: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1);
      --shadow-md: 0 1px 3px 0 rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 1px 3px 0 rgba(0,0,0,0.1), 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-xl: 0 1px 3px 0 rgba(0,0,0,0.1), 0 8px 10px -1px rgba(0,0,0,0.1);
      --shadow-2xl: 0 1px 3px 0 rgba(0,0,0,0.25);
    }

    .light {
      --color-bg-50: #faf9f5;
      --color-bg-100: #f1f1ef;
      --color-bg-200: #e9e6dc;
      --color-bg-300: #e0ddd3;
      --color-bg-400: #d0cdc3;
      --color-bg-500: #b7b5a9;
      --color-bg-700: #908e84;
      --color-bg-800: #6e6d68;

      --color-text-900: #1b1b19;
      --color-text-800: #2c2c2b;
      --color-text-700: #46443b;
      --color-text-600: #6e6d68;
      --color-text-500: #908e84;
      --color-text-400: #b7b5a9;
      --color-text-300: #d0cdc3;
      --color-text-200: #e0ddd3;
      --color-text-100: #f1f1ef;
      --color-text-50: #faf9f5;

      --color-border-200: #e0ddd3;
      --color-border-300: #d0cdc3;
      --color-border-400: #3e3e38;
      --color-border-500: #4a4a43;
      --color-border-600: #52514a;
      --color-border-700: #6e6d68;

      --color-dark-primary: #d97757;
      --color-dark-card: #ffffff;
      --color-dark-card-foreground: #1b1b19;
      --color-dark-muted-foreground: #908e84;
      --color-dark-secondary: #46443b;
      --color-dark-secondary-foreground: #faf9f5;
      --color-dark-accent: #e0ddd3;
      --color-dark-primary-foreground: #faf9f5;
      --color-dark-destructive: #dc2626;

      --shadow-sm: 0 1px 3px 0 rgba(0,0,0,0.06), 0 1px 2px -1px rgba(0,0,0,0.06);
      --shadow-md: 0 1px 3px 0 rgba(0,0,0,0.06), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 1px 3px 0 rgba(0,0,0,0.06), 0 4px 6px -1px rgba(0,0,0,0.06);
      --shadow-xl: 0 1px 3px 0 rgba(0,0,0,0.06), 0 8px 10px -1px rgba(0,0,0,0.06);
      --shadow-2xl: 0 1px 3px 0 rgba(0,0,0,0.12);
    }

    :root {
      --font-display: 'Newsreader', Georgia, ui-serif, serif;
      --font-sans: 'Poppins', ui-sans-serif, system-ui, sans-serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-2xl: 24px;
      --radius-full: 9999px;
    }

    /* ============ Global ============ */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background-color: var(--color-bg-50);
      color: var(--color-text-900);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* ============ Navigation ============ */
    .nav {
      position: sticky;
      top: 0;
      z-index: 50;
      background-color: var(--color-bg-50);
      border-bottom: 1px solid var(--color-border-200);
      height: 56px;
    }
    @media (min-width: 640px) { .nav { height: 64px; } }

    .nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      height: 100%;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    @media (min-width: 768px) { .nav-inner { padding: 0 24px; } }
    @media (min-width: 1024px) { .nav-inner { padding: 0 32px; } }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      color: var(--color-brand-500);
    }
    .nav-brand-text {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-900);
    }
    @media (min-width: 640px) { .nav-brand-text { font-size: 18px; } }

    .nav-categories {
      display: none;
      align-items: center;
      gap: 8px;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
      margin: 0 24px;
    }
    .nav-categories::-webkit-scrollbar { display: none; }
    @media (min-width: 768px) { .nav-categories { display: flex; } }

    .category-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 14px;
      border-radius: var(--radius-full);
      border: 1px solid transparent;
      background-color: transparent;
      color: var(--color-text-500);
      font-family: var(--font-sans);
      font-size: 13px;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }
    .category-pill:hover {
      background-color: var(--color-bg-200);
      color: var(--color-text-700);
    }
    .category-pill.active {
      background-color: var(--color-brand-500);
      color: var(--color-dark-primary-foreground);
      border-color: var(--color-brand-500);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .search-wrap {
      position: relative;
      display: none;
    }
    @media (min-width: 768px) { .search-wrap { display: block; } }

    .search-input {
      width: 200px;
      height: 36px;
      padding: 0 12px 0 36px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border-300);
      background-color: var(--color-bg-100);
      color: var(--color-text-900);
      font-family: var(--font-sans);
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .search-input::placeholder { color: var(--color-text-400); }
    .search-input:focus {
      border-color: var(--color-brand-500);
      box-shadow: 0 0 0 2px rgba(217,119,87,0.15);
    }
    .search-icon-left {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-400);
      pointer-events: none;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--color-text-400);
      cursor: pointer;
      border-radius: var(--radius-full);
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .icon-btn:hover { background-color: var(--color-bg-200); color: var(--color-text-700); }

    .mobile-only { display: inline-flex; }
    @media (min-width: 768px) { .mobile-only { display: none; } }
    .desktop-hide { display: inline-flex; }
    @media (min-width: 640px) { .search-mobile-btn { display: none; } }

    #mobile-menu, #mobile-search-bar { display: none; }
    #mobile-menu.is-open, #mobile-search-bar.is-open { display: block; }

    .mobile-search-bar-inner {
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border-200);
    }
    .mobile-search-bar-inner .search-input { width: 100%; }
    .mobile-search-bar-inner .search-wrap { display: block; position: relative; }

    .mobile-menu-inner {
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border-200);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .mobile-menu-inner::-webkit-scrollbar { display: none; }

    /* ============ Hero ============ */
    #hero-section {
      position: relative;
      overflow: hidden;
      background: linear-gradient(180deg, var(--color-bg-50) 0%, var(--color-bg-100) 100%);
    }
    .hero-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 350px;
      background: var(--color-brand-500);
      opacity: 0.05;
      filter: blur(100px);
      pointer-events: none;
      border-radius: 50%;
    }
    #ink-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 768px;
      margin: 0 auto;
      padding: 64px 16px;
    }
    @media (min-width: 640px) { .hero-content { padding: 80px 16px; } }
    @media (min-width: 1024px) { .hero-content { padding: 112px 16px; } }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(36px, 5vw, 64px);
      font-weight: 500;
      line-height: 1.2;
      color: var(--color-text-900);
      text-wrap: balance;
      word-break: keep-all;
      overflow-wrap: break-word;
      margin: 0;
    }
    .hero-subtitle {
      font-family: var(--font-sans);
      font-size: 16px;
      color: var(--color-text-500);
      margin-top: 16px;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.6;
    }
    @media (min-width: 640px) { .hero-subtitle { font-size: 18px; } }

    /* ============ Card Grid ============ */
    .grid-section {
      background-color: var(--color-bg-50);
      padding: 48px 16px;
    }
    @media (min-width: 640px) { .grid-section { padding: 64px 24px; } }
    @media (min-width: 1024px) { .grid-section { padding: 80px 32px; } }

    .grid-container {
      max-width: 1280px;
      margin: 0 auto;
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }
    @media (max-width: 767px) {
      .tool-grid { grid-template-columns: 1fr; }
    }

    /* ============ Empty State ============ */
    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
      color: var(--color-text-400);
    }
    .empty-state-icon {
      width: 56px;
      height: 56px;
      color: var(--color-text-300);
      margin-bottom: 16px;
    }
    .empty-state-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-600);
      margin-bottom: 6px;
    }
    .empty-state-desc {
      font-size: 13px;
      color: var(--color-text-400);
      max-width: 320px;
      line-height: 1.6;
    }

    /* ============ Tool Card ============ */
    .tool-card {
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border-300);
      background-color: var(--color-dark-card);
      overflow: hidden;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .tool-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .tool-card.card-hidden { display: none; }

    .card-image-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: var(--color-bg-200);
      overflow: hidden;
    }
    .card-preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .tool-card:hover .card-preview-img { transform: scale(1.03); }

    .card-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .tool-card:hover .card-overlay { opacity: 1; }

    .overlay-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      border: none;
      background-color: var(--color-brand-500);
      color: var(--color-dark-primary-foreground);
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.15s ease;
    }
    .overlay-btn:hover { background-color: var(--color-brand-600); }
    .overlay-btn-secondary {
      background-color: rgba(255, 255, 255, 0.15);
      color: var(--color-text-900);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .overlay-btn-secondary:hover { background-color: rgba(255, 255, 255, 0.25); }

    .card-body {
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .card-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-text-900);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      margin: 0;
    }
    .card-desc {
      font-size: 13px;
      color: var(--color-text-500);
      line-height: 1.5;
      margin: 6px 0 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .tech-tag {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      background-color: var(--color-bg-400);
      color: var(--color-text-600);
      font-size: 12px;
      font-family: var(--font-sans);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      height: 24px;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      font-family: var(--font-sans);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .status-live { background-color: var(--color-success-500); color: var(--color-dark-primary-foreground); }
    .status-dev { background-color: var(--color-brand-500); color: var(--color-dark-primary-foreground); }
    .status-exp { background-color: var(--color-brand-400); color: var(--color-text-900); }
    .status-arch { background-color: var(--color-bg-500); color: var(--color-text-400); }

    /* ============ Footer ============ */
    .site-footer {
      background-color: var(--color-bg-50);
      border-top: 1px solid var(--color-border-200);
      padding: 32px 16px;
      text-align: center;
    }
    .footer-link {
      font-size: 12px;
      color: var(--color-text-400);
      text-decoration: none;
      transition: color 0.15s ease;
    }
    .footer-link:hover { color: var(--color-text-600); }

    /* ============ Modal ============ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      overflow-y: auto;
    }
    .modal-overlay.hidden { display: none; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .modal-panel {
      position: relative;
      width: 100%;
      max-width: 800px;
      border-radius: var(--radius-xl);
      background-color: var(--color-bg-100);
      box-shadow: var(--shadow-2xl);
      overflow: hidden;
      z-index: 1;
    }

    .modal-close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      border: none;
      background-color: var(--color-bg-400);
      color: var(--color-text-700);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    .modal-close-btn:hover { background-color: var(--color-bg-500); }

    .modal-image-section {
      width: 100%;
      aspect-ratio: 16 / 7;
      overflow: hidden;
      background-color: var(--color-bg-200);
    }
    .modal-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-content-body {
      padding: 24px 28px 32px;
    }

    .modal-title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--color-text-900);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      min-width: 0;
      margin: 0;
    }
    @media (min-width: 640px) { .modal-title { font-size: 24px; } }

    .modal-desc {
      font-size: 14px;
      color: var(--color-text-500);
      line-height: 1.6;
      margin: 8px 0 0;
    }

    .modal-time {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--color-text-300);
      margin-top: 4px;
    }

    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 24px;
      margin-bottom: 0;
    }

    .modal-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--color-border-200);
    }
    .modal-section-heading {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-text-900);
      margin: 0 0 10px;
    }

    .modal-text {
      color: var(--color-text-600);
      line-height: 1.8;
      font-size: 14px;
      margin: 0;
    }

    .prompt-block {
      padding: 14px 18px;
      border-radius: var(--radius-md);
      background-color: var(--color-bg-50);
      border: 1px solid var(--color-border-300);
    }
    .prompt-label {
      display: block;
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--color-text-400);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    .prompt-code {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--color-text-700);
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
      margin: 0;
    }

    .feature-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .feature-list li {
      font-size: 14px;
      color: var(--color-text-600);
      line-height: 1.6;
      padding-left: 18px;
      position: relative;
    }
    .feature-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 9px;
      width: 6px;
      height: 6px;
      border-radius: var(--radius-full);
      background-color: var(--color-brand-500);
    }

    .modal-meta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
      margin-bottom: 16px;
    }
    .meta-label {
      font-size: 12px;
      color: var(--color-text-400);
    }

    .modal-cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 24px;
      margin-top: 24px;
      border-radius: var(--radius-sm);
      background-color: var(--color-brand-500);
      color: var(--color-dark-primary-foreground);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      transition: background-color 0.15s ease;
    }
    .modal-cta-btn:hover { background-color: var(--color-brand-600); }

    @media (max-width: 639px) {
      .modal-overlay {
        padding: 16px 0;
        align-items: flex-end;
      }
      .modal-panel {
        max-width: 100%;
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-content-body { padding: 20px 18px 28px; }
      .modal-image-section { aspect-ratio: 16 / 9; }
    }

    /* ============ Reduced Motion ============ */
    @media (prefers-reduced-motion: reduce) {
      #ink-canvas { display: none; }
      * { transition: none !important; }
    }

    /* Hide scrollbars for horizontal scroll containers */
    .no-scrollbar { scrollbar-width: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>

          <path d="M2 17l10 5 10-5"></path>

      </div>

      <!-- Desktop Categories -->
      <div class="nav-categories no-scrollbar" id="desktop-categories"></div>

      <!-- Right Controls -->
      <div class="nav-right">
        <div class="search-wrap">
          <i data-lucide="search" class="search-icon-left" style="width:14px;height:14px;"></i>

        <button id="mobile-search-btn" class="icon-btn search-mobile-btn" aria-label="搜索">
          <i data-lucide="search" style="width:20px;height:20px;"></i>
        </button>

        <button id="hamburger-btn" class="icon-btn mobile-only" aria-label="打开菜单">
          <i data-lucide="menu" style="width:20px;height:20px;"></i>
        </button>
      </div>
    </div>

    <!-- Mobile Search Bar -->
    <div id="mobile-search-bar">
      <div class="mobile-search-bar-inner">
        <div class="search-wrap">
          <i data-lucide="search" class="search-icon-left" style="width:14px;height:14px;"></i>
          <input type="text" id="mobile-search" class="search-input" placeholder="搜索工具..." aria-label="搜索工具">
        </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu">
      <div class="mobile-menu-inner no-scrollbar" id="mobile-categories"></div>

  <!-- ============ Main ============ -->
  <main>
    <!-- Hero -->
    <section id="hero-section">
      <div class="hero-glow"></div>
      <canvas id="ink-canvas"></canvas>
      <div class="hero-content">
        <h1 class="hero-title">用自然语言写出来的产品</h1>

  <!-- ============ Footer ============ -->

  </footer>

  <!-- ============ Detail Modal ============ -->
  <div id="detail-modal" class="modal-overlay hidden">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-panel">
      <button id="modal-close" class="modal-close-btn" aria-label="关闭">
        <i data-lucide="x" style="width:20px;height:20px;"></i>
      </button>
      <div class="modal-image-section">
        <img id="modal-image" src="" alt="" class="modal-image">
      </div>
      <div class="modal-content-body">
        <div class="modal-title-row">
          <h2 class="modal-title" id="modal-title"></h2>
          <span class="status-badge" id="modal-status"></span>
        </div>
        <p class="modal-desc" id="modal-desc"></p>

          <i data-lucide="calendar" style="width:12px;height:12px;"></i>

      </div>

  <script>
    (function () {
      'use strict';

      /* ============================================================
       * Tool Data
       * 工具数据为空，等待上传工具后填入。
       * 字段说明见 spec.md 第 11 节：
       *   name       项目名称
       *   desc       一句话简介
       *   category   分类: Web应用 | 小工具 | Chrome插件 | 自动化脚本 | 实验性项目
       *   status     状态: 已上线 | 开发中 | 实验性 | Archive
       *   image      预览图路径 (img/xxx.png)
       *   link       在线体验相对路径 (tools/xxx.html)
       *   created    创建时间
       *   tech       技术标签数组 (最多 3 项)
       *   prompt     原始 Prompt
       *   aiTool     使用的 AI 工具
       *   iterations 迭代轮数
       *   problem    解决什么问题
       *   features   核心功能列表 (最多 4 项)
       *   story      构建故事
       * ============================================================ */
      var toolData = [];

      /* ---------- Status mapping ---------- */
      var statusClassMap = {
        '已上线': 'status-live',
        '开发中': 'status-dev',
        '实验性': 'status-exp',
        'Archive': 'status-arch'
      };
      function statusClass(status) {
        return statusClassMap[status] || 'status-arch';
      }

      /* ---------- Build categories dynamically from toolData ---------- */
      function buildCategories() {
        var cats = ['全部'];
        var seen = {};
        for (var i = 0; i < toolData.length; i++) {
          var c = toolData[i].category;
          if (c && !seen[c]) { seen[c] = true; cats.push(c); }
        }
        return cats;
      }

      /* ---------- State ---------- */
      var currentCategory = '全部';
      var currentSearch = '';

      /* ---------- Render category pills (desktop + mobile) ---------- */
      function renderCategories() {
        var cats = buildCategories();
        var desktop = document.getElementById('desktop-categories');
        var mobile = document.getElementById('mobile-categories');
        desktop.innerHTML = '';
        mobile.innerHTML = '';

        for (var i = 0; i < cats.length; i++) {
          (function (label) {
            var pill = document.createElement('button');
            pill.type = 'button';
            pill.className = 'category-pill' + (label === currentCategory ? ' active' : '');
            pill.textContent = label;
            pill.setAttribute('data-category', label);
            pill.addEventListener('click', function () {
              currentCategory = label;
              syncActivePill();
              applyFilters();
              closeMobileMenu();
            });
            desktop.appendChild(pill);

            var pillM = pill.cloneNode(true);
            pillM.addEventListener('click', function () {
              currentCategory = label;
              syncActivePill();
              applyFilters();
              closeMobileMenu();
            });
            mobile.appendChild(pillM);
          })(cats[i]);
        }
      }

      function syncActivePill() {
        var pills = document.querySelectorAll('.category-pill');
        for (var i = 0; i < pills.length; i++) {
          var p = pills[i];
          if (p.getAttribute('data-category') === currentCategory) {
            p.classList.add('active');
          } else {
            p.classList.remove('active');
          }
        }
      }

      /* ---------- Render tool cards ---------- */
      function renderCards() {
        var grid = document.getElementById('tool-grid');
        grid.innerHTML = '';

        if (toolData.length === 0) {
          var empty = document.createElement('div');
          empty.className = 'empty-state';
          empty.innerHTML =
            '<svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M12 2L2 7l10 5 10-5-10-5z"></path>' +
            '<path d="M2 17l10 5 10-5"></path>' +
            '<path d="M2 12l10 5 10-5"></path>' +
            '</svg>' +
            '<div class="empty-state-title">还没有工具上架</div>' +
            '<div class="empty-state-desc">工具上架后将在这里以作品卡片的形式展示，敬请期待。</div>';
          grid.appendChild(empty);
          return;
        }

        for (var i = 0; i < toolData.length; i++) {
          grid.appendChild(buildCard(toolData[i], i));
        }
        if (window.lucide) { lucide.createIcons(); }
      }

      function buildCard(tool, index) {
        var card = document.createElement('article');
        card.className = 'tool-card';
        card.setAttribute('data-category', tool.category || '');
        card.setAttribute('data-name', (tool.name || '').toLowerCase());
        card.setAttribute('data-desc', (tool.desc || '').toLowerCase());

        var imgWrap = document.createElement('div');
        imgWrap.className = 'card-image-wrapper';

        var img = document.createElement('img');
        img.className = 'card-preview-img';
        img.src = tool.image || '';
        img.alt = (tool.name || '工具') + ' 界面截图';
        img.loading = index === 0 ? 'eager' : 'lazy';
        imgWrap.appendChild(img);

        var overlay = document.createElement('div');
        overlay.className = 'card-overlay';

        var detailBtn = document.createElement('button');
        detailBtn.type = 'button';
        detailBtn.className = 'overlay-btn';
        detailBtn.textContent = '查看详情';
        detailBtn.setAttribute('data-index', String(index));
        detailBtn.addEventListener('click', function () { openModal(index); });
        overlay.appendChild(detailBtn);

        var link = document.createElement('a');
        link.className = 'overlay-btn overlay-btn-secondary';
        link.href = tool.link || '#';
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = '在线体验';
        overlay.appendChild(link);

        imgWrap.appendChild(overlay);
        card.appendChild(imgWrap);

        var body = document.createElement('div');
        body.className = 'card-body';

        var titleRow = document.createElement('div');
        titleRow.className = 'card-title-row';
        var title = document.createElement('h3');
        title.className = 'card-title';
        title.textContent = tool.name || '';
        var status = document.createElement('span');
        status.className = 'status-badge ' + statusClass(tool.status);
        status.textContent = tool.status || '';
        titleRow.appendChild(title);
        titleRow.appendChild(status);
        body.appendChild(titleRow);

        var desc = document.createElement('p');
        desc.className = 'card-desc';
        desc.textContent = tool.desc || '';
        body.appendChild(desc);

        if (tool.tech && tool.tech.length) {
          var tags = document.createElement('div');
          tags.className = 'card-tags';
          for (var t = 0; t < tool.tech.length && t < 3; t++) {
            var tag = document.createElement('span');
            tag.className = 'tech-tag';
            tag.textContent = tool.tech[t];
            tags.appendChild(tag);
          }
          body.appendChild(tags);
        }

        card.appendChild(body);
        return card;
      }

      /* ---------- Filters (category + search intersection) ---------- */
      function applyFilters() {
        var cards = document.querySelectorAll('.tool-card');
        var q = currentSearch.trim().toLowerCase();
        for (var i = 0; i < cards.length; i++) {
          var c = cards[i];
          var cat = c.getAttribute('data-category');
          var name = c.getAttribute('data-name') || '';
          var desc = c.getAttribute('data-desc') || '';
          var matchCat = (currentCategory === '全部') || (cat === currentCategory);
          var matchSearch = !q || (name.indexOf(q) !== -1) || (desc.indexOf(q) !== -1);
          if (matchCat && matchSearch) {
            c.classList.remove('card-hidden');
          } else {
            c.classList.add('card-hidden');
          }
        }
      }

      /* ---------- Search ---------- */
      function initSearch() {
        var desktop = document.getElementById('desktop-search');
        var mobile = document.getElementById('mobile-search');
        function onInput(e) {
          currentSearch = e.target.value;
          if (desktop !== e.target) { desktop.value = currentSearch; }
          if (mobile !== e.target) { mobile.value = currentSearch; }
          applyFilters();
        }
        desktop.addEventListener('input', onInput);
        mobile.addEventListener('input', onInput);
      }

      /* ---------- Mobile menu ---------- */
      function initMobileMenu() {
        var hamburger = document.getElementById('hamburger-btn');
        var menu = document.getElementById('mobile-menu');
        var searchBtn = document.getElementById('mobile-search-btn');
        var searchBar = document.getElementById('mobile-search-bar');

        hamburger.addEventListener('click', function () {
          menu.classList.toggle('is-open');
          searchBar.classList.remove('is-open');
        });
        searchBtn.addEventListener('click', function () {
          searchBar.classList.toggle('is-open');
          menu.classList.remove('is-open');
          if (searchBar.classList.contains('is-open')) {
            var inp = document.getElementById('mobile-search');
            if (inp) { inp.focus(); }
          }
        });
      }
      function closeMobileMenu() {
        document.getElementById('mobile-menu').classList.remove('is-open');
      }

      /* ---------- Theme ---------- */
      function initTheme() {
        var html = document.documentElement;
        var sun = document.getElementById('icon-sun');
        var moon = document.getElementById('icon-moon');
        var btn = document.getElementById('theme-toggle');
        var stored = null;
        try { stored = localStorage.getItem('toolbox-theme'); } catch (e) {}

        function apply(theme) {
          if (theme === 'light') {
            html.classList.remove('dark');
            html.classList.add('light');
            sun.style.display = 'none';
            moon.style.display = 'inline-block';
          } else {
            html.classList.remove('light');
            html.classList.add('dark');
            sun.style.display = 'inline-block';
            moon.style.display = 'none';
          }
        }
        apply(stored || 'dark');

        btn.addEventListener('click', function () {
          var isLight = html.classList.contains('light');
          var next = isLight ? 'dark' : 'light';
          apply(next);
          try { localStorage.setItem('toolbox-theme', next); } catch (e) {}
        });
      }

      /* ---------- Modal ---------- */
      function openModal(index) {
        var tool = toolData[index];
        if (!tool) return;
        var modal = document.getElementById('detail-modal');

        document.getElementById('modal-title').textContent = tool.name || '';
        document.getElementById('modal-desc').textContent = tool.desc || '';
        document.getElementById('modal-time').textContent = tool.created || '';
        document.getElementById('modal-problem').textContent = tool.problem || '';
        document.getElementById('modal-prompt').textContent = tool.prompt || '';
        document.getElementById('modal-ai-tool').textContent = tool.aiTool || '';
        document.getElementById('modal-iterations').textContent = tool.iterations || '';
        document.getElementById('modal-story').textContent = tool.story || '';

        var statusEl = document.getElementById('modal-status');
        statusEl.className = 'status-badge ' + statusClass(tool.status);
        statusEl.textContent = tool.status || '';

        var img = document.getElementById('modal-image');
        img.src = tool.image || '';
        img.alt = (tool.name || '工具') + ' 界面截图';

        var tagsEl = document.getElementById('modal-tags');
        tagsEl.innerHTML = '';
        if (tool.tech) {
          for (var i = 0; i < tool.tech.length && i < 3; i++) {
            var tag = document.createElement('span');
            tag.className = 'tech-tag';
            tag.textContent = tool.tech[i];
            tagsEl.appendChild(tag);
          }
        }

        var feats = document.getElementById('modal-features');
        feats.innerHTML = '';
        if (tool.features) {
          for (var j = 0; j < tool.features.length && j < 4; j++) {
            var li = document.createElement('li');
            li.textContent = tool.features[j];
            feats.appendChild(li);
          }
        }

        var cta = document.getElementById('modal-cta');
        cta.href = tool.link || '#';
        cta.target = '_blank';
        cta.rel = 'noopener noreferrer';

        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }
      function closeModal() {
        document.getElementById('detail-modal').classList.add('hidden');
        document.body.style.overflow = '';
      }
      function initModal() {
        document.getElementById('modal-close').addEventListener('click', closeModal);
        document.getElementById('modal-backdrop').addEventListener('click', closeModal);
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { closeModal(); }
        });
      }

      /* ---------- Footer Year ---------- */
      function setFooterYear() {
        var el = document.getElementById('footer-year');
        if (el) { el.textContent = String(new Date().getFullYear()); }
      }

      /* ---------- Ink Ripple Canvas ---------- */
      function initInkCanvas() {
        var canvas = document.getElementById('ink-canvas');
        if (!canvas) return;
        var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion) { canvas.style.display = 'none'; return; }

        var hero = document.getElementById('hero-section');
        var ctx = canvas.getContext('2d');
        var dpr = Math.min(window.devicePixelRatio || 1, 2);

        var INK_PRIMARY = [217, 119, 87];
        var INK_SECONDARY = [176, 104, 63];
        var INK_MIST = [142, 87, 64];
        var MAX_PARTICLES = 300;

        var particles = [];
        var animId = null;
        var lastTime = 0;
        var lastRipplePos = null;

        function resize() {
          var rect = hero.getBoundingClientRect();
          canvas.width = Math.max(1, Math.floor(rect.width * dpr));
          canvas.height = Math.max(1, Math.floor(rect.height * dpr));
          canvas.style.width = rect.width + 'px';
          canvas.style.height = rect.height + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        function rand(a, b) { return a + Math.random() * (b - a); }
        function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }

        function pickColor() {
          var r = Math.random();
          if (r < 0.6) return INK_PRIMARY;
          if (r < 0.85) return INK_SECONDARY;
          return INK_MIST;
        }

        function createTrail(x, y, speed) {
          var angle = Math.random() * Math.PI * 2;
          var dist = Math.random() * Math.min(speed * 0.4, 30);
          var baseR = rand(2, 5);
          return {
            type: 'trail',
            x: x + Math.cos(angle) * dist,
            y: y + Math.sin(angle) * dist,
            baseR: baseR,
            maxR: baseR + rand(8, 18),
            color: pickColor(),
            alpha: rand(0.3, 0.7),
            life: rand(2000, 4000),
            born: performance.now(),
            jitter: []
          };
        }

        function createRipple(x, y, opts) {
          opts = opts || {};
          return {
            type: 'ripple',
            x: x, y: y,
            r: 2,
            maxR: opts.maxR || rand(80, 150),
            alpha: opts.alpha != null ? opts.alpha : 0.5,
            speed: rand(60, 120),
            color: INK_PRIMARY,
            life: rand(1500, 2500),
            born: performance.now()
          };
        }

        function createMist(x, y) {
          return {
            type: 'mist',
            x: x + rand(-60, 60),
            y: y + rand(-60, 60),
            r: rand(200, 400),
            alpha: rand(0.03, 0.08),
            color: INK_MIST,
            life: rand(3000, 5000),
            born: performance.now()
          };
        }

        function spawn(p) {
          if (particles.length >= MAX_PARTICLES) particles.shift();
          particles.push(p);
        }

        function startLoop() {
          if (animId) return;
          lastTime = performance.now();
          animId = requestAnimationFrame(loop);
        }

        function loop(ts) {
          var dt = Math.min(ts - lastTime, 50);
          lastTime = ts;
          var w = canvas.width / dpr;
          var h = canvas.height / dpr;
          ctx.clearRect(0, 0, w, h);

          var now = ts;
          var alive = [];
          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            var progress = (now - p.born) / p.life;
            if (progress >= 1) continue;
            draw(p, progress);
            if (p.alpha * (1 - progress) > 0.005) alive.push(p);
          }
          particles = alive;
          if (particles.length > 0) {
            animId = requestAnimationFrame(loop);
          } else {
            animId = null;
          }
        }

        function draw(p, progress) {
          if (p.type === 'trail') {
            var r = p.baseR + (p.maxR - p.baseR) * (1 - Math.pow(1 - progress, 3));
            var a = p.alpha * (1 - progress);
            ctx.beginPath();
            for (var k = 0; k < 8; k++) {
              var ang = (k / 8) * Math.PI * 2;
              var jitter = (k % 2 === 0) ? rand(0.7, 1.3) : 1;
              var rr = r * jitter;
              var px = p.x + Math.cos(ang) * rr;
              var py = p.y + Math.sin(ang) * rr;
              if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fillStyle = rgba(p.color, a);
            ctx.fill();
          } else if (p.type === 'ripple') {
            p.r = 2 + (p.maxR - 2) * (1 - Math.pow(1 - progress, 3));
            var lw = Math.max(0.5, 2 - 1.5 * progress);
            var ra = p.alpha * (1 - progress);
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.strokeStyle = rgba(p.color, ra);
            ctx.lineWidth = lw;
            ctx.stroke();
          } else if (p.type === 'mist') {
            var fade = progress < 0.2 ? (progress / 0.2) : (1 - ((progress - 0.2) / 0.8));
            var ma = p.alpha * fade;
            var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
            grad.addColorStop(0, rgba(p.color, ma * 0.6));
            grad.addColorStop(1, rgba(p.color, 0));
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function pos(e) {
          var rect = hero.getBoundingClientRect();
          return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        hero.addEventListener('mousemove', function (e) {
          var p = pos(e);
          if (!lastRipplePos) { lastRipplePos = { x: p.x, y: p.y }; }
          var dx = p.x - lastRipplePos.x;
          var dy = p.y - lastRipplePos.y;
          var speed = Math.sqrt(dx * dx + dy * dy);
          if (speed > 1) {
            var n = Math.min(6, Math.max(1, Math.floor(speed * 0.15)));
            for (var i = 0; i < n; i++) { spawn(createTrail(p.x, p.y, speed)); }
            var pathLen = Math.sqrt(dx * dx + dy * dy);
            if (pathLen >= rand(80, 120)) {
              spawn(createRipple(p.x, p.y));
              lastRipplePos = { x: p.x, y: p.y };
            }
            if (Math.random() < 0.03) { spawn(createMist(p.x, p.y)); }
          }
          startLoop();
        });

        hero.addEventListener('mouseenter', function (e) {
          var p = pos(e);
          for (var i = 0; i < 4; i++) {
            (function (i) {
              setTimeout(function () {
                spawn(createRipple(p.x + rand(-40, 40), p.y + rand(-30, 30), {
                  alpha: 0.35, maxR: rand(60, 120)
                }));
                startLoop();
              }, i * 120);
            })(i);
          }
        });
      }

      /* ---------- Init ---------- */
      function init() {
        setFooterYear();
        renderCategories();
        renderCards();
        applyFilters();
        initSearch();
        initMobileMenu();
        initTheme();
        initModal();
        if (window.lucide) { lucide.createIcons(); }
        initInkCanvas();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
